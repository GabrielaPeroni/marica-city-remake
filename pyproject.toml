[project]
name = "site-python"
version = "0.2.0"
description = "Django site with uv"
authors = [{ name = "Noell" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.7,<6.0",
    "psycopg2-binary>=2.9.11,<3.0",
    "python-decouple>=3.8,<4.0",
    "pillow>=12.3.0,<13.0",
    "django-ratelimit>=4.1.0,<5.0",
    "django-redis>=7.0.0,<8.0",
    "gunicorn>=26.2.0,<27.0",
    "whitenoise>=6.12.0,<7.0",
    "django-storages[s3]>=1.14.6,<2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    # Code formatting and linting
    "black>=26.3.1,<27.0",
    "isort>=9.0.1,<10.0",
    "autoflake>=2.2.1,<3.0",
    "flake8>=6.1.0,<7.0",
    "flake8-mock-spec>=1.4.0,<2.0",

    # Security and upgrades
    "pip-audit>=2.7.3,<3.0",
    "django-upgrade>=1.15.0,<2.0",
    "pyupgrade>=3.15.0,<4.0",

    # Pre-commit and testing
    "pre-commit>=3.6.0,<4.0",
    "django-extra-checks>=0.13.3,<0.14",

    # Type checking (optional)
    "mypy>=1.8.0,<2.0",
    "django-stubs>=4.2.7,<5.0",

    # Tool configurations
    "coverage>=7.11.0,<8.0",

    # Versioning and changelog automation
    "commitizen>=3.29.0,<4.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
  | staticfiles
  | media
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_django = "django"
known_first_party = ["apps", "config"]
skip_glob = ["*/migrations/*", "*/venv/*", "*/env/*"]

[tool.flake8]
max-line-length = 88
select = ["TMS010", "TMS011", "TMS012", "TMS013", "TMS020", "TMS021", "TMS022"]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "build",
    "dist",
    ".tox",
    ".eggs",
    "*.egg",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = ["pyproject.toml:version"]
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
tag_format = "v$version"
