{% load i18n icons %}
<div id="login-popover" class="popover" data-login-popover>
  <button type="button" id="login-popover-trigger" class="btn" data-variant="ghost" aria-expanded="false" aria-controls="login-popover-content">
    {% icon "circle-user" class="size-5" %}<span>{% translate "Entrar" %}</span>
  </button>
  <div id="login-popover-content" class="w-[min(20rem,calc(100vw-2rem))] p-5" data-popover data-align="end" aria-hidden="true">
    <h2 class="font-display text-lg font-semibold">{% translate "Entre na sua conta" %}</h2>
    <form method="post" action="{% url 'accounts:login' %}" class="login-dropdown-form mt-4 grid gap-4">
      {% csrf_token %}
      <div class="field gap-2">
        <label for="dropdownUsername">{% translate "Nome de usuário" %}</label>
        <input type="text" id="dropdownUsername" name="username" autocomplete="username" required>
      </div>
      <div class="field gap-2">
        <label for="dropdownPassword">{% translate "Senha" %}</label>
        <input type="password" id="dropdownPassword" name="password" autocomplete="current-password" required>
        <a href="{% url 'accounts:password_reset' %}" class="w-fit text-xs text-muted-foreground underline-offset-4 hover:text-foreground hover:underline">{% translate "Esqueci minha senha" %}</a>
      </div>
      <button type="submit" class="btn w-full" data-size="lg">{% translate "Entrar" %}</button>
      <p class="text-center text-sm text-muted-foreground">
        {% translate "Não tem uma conta?" %}
        <a href="{% url 'accounts:register' %}" class="font-semibold text-foreground underline-offset-4 hover:underline">{% translate "Cadastre-se agora" %}</a>
      </p>
    </form>

    <div class="my-4 flex items-center gap-3 text-xs text-muted-foreground" aria-hidden="true">
      <span class="h-px flex-1 bg-border"></span>{% translate "ou" %}<span class="h-px flex-1 bg-border"></span>
    </div>

    <div id="google-signin-button" class="flex min-h-10 justify-center"></div>
  </div>
</div>
