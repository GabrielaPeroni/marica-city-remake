{% load i18n static %}

<div class="admin-topbar">
  <!-- Botão de Menu Mobile -->
  <button class="mobile-menu-btn d-lg-none" id="mobileMenuBtn">
    <i class="bi bi-list"></i>
  </button>

  <!-- Mensagem de Boas-vindas -->
  <div class="topbar-welcome">
    <h1>{% firstof request.user.first_name request.user.username as admin_name %}{% blocktranslate %}Bem-vindo, {{ admin_name }}{% endblocktranslate %}</h1>
  </div>

  <!-- Ações da Barra Superior -->
  <div class="topbar-actions">
    <!-- Menu do Usuário -->
    <div class="user-menu" id="userMenuToggle">
      <div class="user-avatar-placeholder">
        <i class="bi bi-person-circle"></i>
      </div>
      <span class="user-name d-none d-md-inline">{{ request.user.username }}</span>
      <i class="bi bi-chevron-down"></i>
    </div>

    <!-- Menu Suspenso do Usuário -->
    <div class="user-dropdown" id="userDropdown">
      <div class="dropdown-header">
        <strong>{{ request.user.username }}</strong>
        <small class="text-muted">{{ request.user.email }}</small>
      </div>
      <div class="dropdown-divider"></div>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{% url 'core:landing' %}">
        <button type="submit" class="dropdown-item text-danger">
          <i class="bi bi-box-arrow-left me-2"></i>{% translate "Sair" %}
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Botão do menu mobile
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('adminSidebar');
    const overlay = document.getElementById('sidebarOverlay');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', function() {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
        document.body.classList.toggle('sidebar-open');
      });
    }

    // Menu suspenso do usuário
    const userMenuToggle = document.getElementById('userMenuToggle');
    const userDropdown = document.getElementById('userDropdown');

    if (userMenuToggle && userDropdown) {
      userMenuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        userDropdown.classList.toggle('show');
      });

      // Fechar menu suspenso ao clicar fora
      document.addEventListener('click', function(e) {
        if (!userMenuToggle.contains(e.target) && !userDropdown.contains(e.target)) {
          userDropdown.classList.remove('show');
        }
      });
    }

  });
</script>
