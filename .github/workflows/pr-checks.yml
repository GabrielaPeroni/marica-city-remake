name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lintert:
    name: Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Check __init__.py files
        run: |
          uv run python .github/check_innit.py

      - name: Run Black
        run: |
          uv run black --check --diff .

      - name: Run isort
        run: |
          uv run isort --check-only --diff .

      - name: Run autoflake
        run: |
          uv run autoflake --check --remove-all-unused-imports --remove-unused-variables --remove-duplicate-keys --ignore-init-module-imports --recursive apps/ config/ manage.py .github/check_innit.py

      - name: Run flake8
        run: |
          uv run flake8 --select=TMS010,TMS011,TMS012,TMS013,TMS020,TMS021,TMS022 apps/ config/ manage.py .github/check_innit.py

      - name: Run pip-audit
        run: |
          uv run pip-audit

      - name: Install Prettier
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Prettier
        run: |
          npm install -g prettier@3.1.0

      - name: Run Prettier
        run: |
          prettier --config .github/.prettierrc --ignore-path .github/.prettierignore --check "**/*.{js,ts,jsx,tsx,json,yaml,yml,md,html,css}" || (echo "::error::Some files need formatting. Run 'prettier --write .' to fix." && exit 1)

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Create .env file for testing
        run: |
          echo "DEBUG=True" > .env
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env
          echo "GOOGLE_OAUTH_CLIENT_ID=test-client-id-for-ci-only" >> .env
          echo "RATELIMIT_ENABLE=False" >> .env

      - name: Check Django system
        run: |
          uv run python manage.py check --deploy

      - name: Run Django migrations check
        run: |
          uv run python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: |
          uv run python manage.py test apps --verbosity=2

      - name: Run tests under coverage and enforce floor
        run: |
          uv run coverage run manage.py test apps --verbosity=0
          uv run coverage report --fail-under=70
