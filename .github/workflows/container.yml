name: Container

# Builds the production image, runs it against Postgres with production settings
# and smoke-tests it. On main it is published to GHCR; a v* tag also creates a
# GitHub Release from the CHANGELOG.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: maricacity
          POSTGRES_PASSWORD: maricacity
          POSTGRES_DB: maricacity
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: maricacity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment checks (default production settings)
        run: |
          docker run --rm \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e ALLOWED_HOSTS=example.com \
            -e GOOGLE_OAUTH_CLIENT_ID=ci \
            maricacity:ci python manage.py check --deploy --fail-level WARNING

      # CI has no TLS proxy in front, so the HTTPS redirect is the one setting
      # turned off; everything else runs as in production.
      - name: Start container
        run: |
          docker run -d --name app --network host \
            -e DEBUG=False \
            -e SECURE_SSL_REDIRECT=False \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e ALLOWED_HOSTS=localhost \
            -e GOOGLE_OAUTH_CLIENT_ID=ci \
            -e DB_ENGINE=django.db.backends.postgresql \
            -e DB_NAME=maricacity -e DB_USER=maricacity -e DB_PASSWORD=maricacity \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            maricacity:ci

      - name: Migrate
        run: docker exec app python manage.py migrate --noinput

      - name: Wait for the Docker healthcheck
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "::error::Container never became healthy ($status)"
          exit 1

      - name: Smoke-test pages and static files
        run: |
          for path in / /explore/ /eventos/ /sobre/ /accounts/register/ /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
          css=$(curl -s http://localhost:8000/ | grep -o '/static/css/main\.[0-9a-f]*\.css' | head -1)
          [ -n "$css" ] || { echo "::error::Hashed stylesheet not found in the page"; exit 1; }
          curl -sI "http://localhost:8000$css" | grep -i 'cache-control: .*immutable'

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true

      - name: Container logs
        if: failure()
        run: docker logs app

  publish:
    name: Publish image to GHCR
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG section for $version"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
