name: Deploy check

# Vercel reports each deployment back to GitHub. When the production deploy
# succeeds, smoke-test the live site and run Lighthouse against it. (Preview
# URLs sit behind Vercel's deployment protection by default, so they're skipped.)
on: deployment_status

permissions:
  contents: read

jobs:
  live:
    name: Smoke-test production
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      SITE: ${{ github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pages respond
        run: |
          for path in /healthz/ / /explore/ /eventos/ /sobre/ /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE }}/
            ${{ env.SITE }}/explore/
            ${{ env.SITE }}/eventos/
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
